# LibreDCM in TLS mode (Go crypto/tls, TLS 1.2 minimum, no client
# certificate). Expected identification from docs/qms/uid-registry.md: a
# build without a release version is 1.3.6.1.4.1.67686.1.1.1.0.0 /
# LIBREDCM_0_0.
name: LibreDCM TLS smoke
target: libredcm
timeout: 10s
steps:
  - id: negotiation
    type: associate
    verifies: [DVT-SRS-090, DVT-SRS-093, DVT-SRS-100, DVT-SRS-101, DVT-SRS-102, DVT-SRS-107]
    contexts:
      - {abstract_syntax: "1.2.840.10008.1.1", transfer_syntaxes: ["1.2.840.10008.1.2"], expect: accepted, expect_transfer_syntax: "1.2.840.10008.1.2"}
      - {abstract_syntax: "1.2.840.10008.5.1.4.1.1.2", transfer_syntaxes: ["1.2.840.10008.1.2.1", "1.2.840.10008.1.2"], expect: accepted}
      - {abstract_syntax: "1.2.3.4.5", transfer_syntaxes: ["1.2.840.10008.1.2"], expect: rejected}
    expect:
      impl_class_uid: "1.3.6.1.4.1.67686.1.1.1.0.0"
      impl_version: "LIBREDCM_0_0"
  - id: echo-over-tls
    type: echo
  - id: plaintext-refused
    type: tls_reject
    mode: plaintext
  - id: tls10-refused
    type: tls_reject
    mode: tls_version
    tls_version: "1.0"
  - id: tls11-refused
    type: tls_reject
    mode: tls_version
    tls_version: "1.1"
