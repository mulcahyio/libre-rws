# DICOM associations are long-lived TCP sessions, so balance at layer 4 by
# connection count. Backends are discovered through Docker's DNS, so scaling
# the dicom service needs no config change. Health is the module's /readyz.
global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client  10m
  timeout server  10m

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend dicom_in
  bind :11112
  default_backend dicom_nodes

backend dicom_nodes
  balance leastconn
  # A node that has just died fails the TCP connect; retry on another node
  # instead of failing the association while health checks catch up.
  retries 3
  option redispatch
  option httpchk GET /readyz
  http-check expect status 200
  server-template dicom 10 dicom:11112 check port 8081 inter 2s fall 2 rise 2 resolvers docker init-addr none

frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /
