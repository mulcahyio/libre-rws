# Single node: one gateway, embedded SQLite index, local volume, NATS for events.
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    restart: unless-stopped

  dicom:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile.dicom}
    image: libre/dcm:dev
    environment:
      LIBRE_DCM_NODE_ID: dicom-1
      LIBRE_DCM_EVENTS_DRIVER: nats
      LIBRE_DCM_EVENTS_URL: nats://nats:4222
    ports: ["11112:11112", "8081:8081"]
    volumes: [dicom-data:/var/lib/libredcm]
    depends_on: [nats]
    restart: unless-stopped

volumes:
  nats-data:
  dicom-data:
