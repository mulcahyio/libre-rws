# LibreDCM - workstation install (single node)
# Libre RWS (Radiology Workflow System) - developed by Patrick Mulcahy, Mulcahy.io <dev@mulcahy.io>
#
# Settings live in .env, written by the installer (LibreDCM.sh / LibreDCM.ps1
# `install` or `configure`). Optional event bus: LIBRE_DCM_EVENTS_DRIVER=nats
# plus `--profile events` (the installer adds it).

name: libredcm

services:
  dicom:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dicom
      args:
        VERSION: "${LIBRE_DCM_VERSION:-0.2.0-beta.1}"
    image: "libre/dcm:${LIBRE_DCM_VERSION:-0.2.0-beta.1}"
    container_name: libredcm
    restart: unless-stopped
    environment:
      LIBRE_DCM_NODE_ID: "${LIBRE_DCM_NODE_ID:-workstation}"
      LIBRE_DCM_AE_TITLE: "${LIBRE_DCM_AE_TITLE:-LIBREDCM}"
      LIBRE_DCM_ALLOW_ANY_CALLED_AE: "${LIBRE_DCM_ALLOW_ANY_CALLED_AE:-false}"
      LIBRE_DCM_ACCEPT_ANY_SOP_CLASS: "${LIBRE_DCM_ACCEPT_ANY_SOP_CLASS:-false}"
      LIBRE_DCM_REMOTE_AES: "${LIBRE_DCM_REMOTE_AES:-}"
      LIBRE_DCM_ALLOWED_AES: "${LIBRE_DCM_ALLOWED_AES:-}"
      LIBRE_DCM_MAX_ASSOCIATIONS: "${LIBRE_DCM_MAX_ASSOCIATIONS:-16}"
      LIBRE_DCM_ADMIN_TOKEN: "${LIBRE_DCM_ADMIN_TOKEN:-}"
      LIBRE_DCM_LOG_LEVEL: "${LIBRE_DCM_LOG_LEVEL:-info}"
      LIBRE_DCM_LOG_FORMAT: "${LIBRE_DCM_LOG_FORMAT:-text}"
      LIBRE_DCM_EVENTS_DRIVER: "${LIBRE_DCM_EVENTS_DRIVER:-log}"
      LIBRE_DCM_EVENTS_URL: "nats://nats:4222"
      LIBRE_DCM_EVENTS_OMIT_PATIENT_ID: "${LIBRE_DCM_EVENTS_OMIT_PATIENT_ID:-false}"
      LIBRE_DCM_AUDIT_OMIT_PATIENT_ID: "${LIBRE_DCM_AUDIT_OMIT_PATIENT_ID:-false}"
      # Storage: fs (data volume / folder) or s3, chosen at install.
      LIBRE_DCM_STORAGE_DRIVER: "${LIBRE_DCM_STORAGE_DRIVER:-fs}"
      LIBRE_DCM_STORAGE_S3_ENDPOINT: "${LIBRE_DCM_STORAGE_S3_ENDPOINT:-}"
      LIBRE_DCM_STORAGE_S3_BUCKET: "${LIBRE_DCM_STORAGE_S3_BUCKET:-}"
      LIBRE_DCM_STORAGE_S3_REGION: "${LIBRE_DCM_STORAGE_S3_REGION:-}"
      LIBRE_DCM_STORAGE_S3_PREFIX: "${LIBRE_DCM_STORAGE_S3_PREFIX:-}"
      LIBRE_DCM_STORAGE_S3_ACCESS_KEY: "${LIBRE_DCM_STORAGE_S3_ACCESS_KEY:-}"
      LIBRE_DCM_STORAGE_S3_SECRET_KEY: "${LIBRE_DCM_STORAGE_S3_SECRET_KEY:-}"
      LIBRE_DCM_STORAGE_S3_INSECURE: "${LIBRE_DCM_STORAGE_S3_INSECURE:-false}"
      LIBRE_DCM_STORAGE_S3_CREATE_BUCKET: "${LIBRE_DCM_STORAGE_S3_CREATE_BUCKET:-false}"
      # TLS, chosen at install; paths are inside the container (set by the installer).
      LIBRE_DCM_TLS_CERT: "${LIBRE_DCM_TLS_CERT:-}"
      LIBRE_DCM_TLS_KEY: "${LIBRE_DCM_TLS_KEY:-}"
      LIBRE_DCM_ADMIN_TLS_CERT: "${LIBRE_DCM_ADMIN_TLS_CERT:-}"
      LIBRE_DCM_ADMIN_TLS_KEY: "${LIBRE_DCM_ADMIN_TLS_KEY:-}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${LIBRE_DCM_BIND_IP:-0.0.0.0}:${LIBRE_DCM_PORT:-11112}:11112"   # DICOM (modalities, viewers)
      - "127.0.0.1:${LIBRE_DCM_ADMIN_PORT:-8081}:8081"                 # health/metrics - this PC only
    volumes:
      # Docker volume by default; LIBRE_DCM_DATA can name a local folder instead.
      - "${LIBRE_DCM_DATA:-libredcm-data}:/var/lib/libredcm"
      # Your own certificate files (TLS mode "files"); an empty folder otherwise.
      - "${LIBRE_DCM_TLS_DIR:-./tls}:/etc/libredcm/tls:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets C-MOVE reach viewers on this PC (Linux too)
    stop_grace_period: 35s
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  nats:
    profiles: [events]
    image: nats:2.11-alpine
    container_name: libredcm-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    volumes: ["libredcm-nats:/data"]

volumes:
  # An install upgraded from 0.1.x keeps its existing volumes: the installer
  # sets LIBRE_DCM_VOLUME / LIBRE_DCM_NATS_VOLUME to the old names.
  libredcm-data:
    name: "${LIBRE_DCM_VOLUME:-libredcm-data}"
  libredcm-nats:
    name: "${LIBRE_DCM_NATS_VOLUME:-libredcm-nats}"
