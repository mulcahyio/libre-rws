name: fuzz

# Longer fuzzing runs (docs/dhf/libredcm/cybersecurity.md §7). Pull requests
# run only the seed corpora (part of `go test` in qms.yml). This workflow runs
# every target for a fixed time each week, on demand, and before a release.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Time per target (Go duration)"
        default: "5m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fuzz all targets
        # Input passed through env, not interpolated into the script. The
        # default bash shell uses pipefail, so a fuzz failure fails the job.
        env:
          DURATION: ${{ inputs.duration || '5m' }}
        run: bash scripts/qms/fuzz.sh "$DURATION" | tee fuzz-log.txt
      - name: Keep the log and any failing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-records
          path: |
            fuzz-log.txt
            **/testdata/fuzz/**
