# rws-dicom configuration. Every value can also be set by environment
# variable (shown on the right); environment wins over this file.

admin:
  addr: ":8081"              # RWS_ADMIN_ADDR   health, readiness, metrics, version
  log_level: info            # RWS_LOG_LEVEL    debug | info | warn | error
  log_format: json           # RWS_LOG_FORMAT   json | text
  shutdown_timeout: 30s      # RWS_SHUTDOWN_TIMEOUT
  # node_id: dicom-1         # RWS_NODE_ID      defaults to hostname

dicom:
  ae_title: RWS_DICOM        # RWS_DICOM_AE_TITLE
  listen: ":11112"           # RWS_DICOM_LISTEN
  allow_any_called_ae_title: false
  accept_any_sop_class: false
  max_associations: 64       # per node; excess gets a transient reject (retry later)
  max_pdu_length: 131072
  handshake_timeout: 30s
  idle_timeout: 5m
  find_limit: 1000           # max C-FIND matches returned
  get_max_bytes: 1073741824  # C-GET buffers in memory (library limit) - cap it
  # tls_cert_file: /etc/rws/tls/dicom.crt   # DICOM TLS (port 2762 by convention)
  # tls_key_file:  /etc/rws/tls/dicom.key
  remote_aes:                # C-MOVE destinations
    VIEWER1: {host: 10.0.0.20, port: 11112}
    # PACS_B: {host: pacs-b.example, port: 104, ae_title: PACSB}

storage:
  driver: fs                 # RWS_STORAGE_DRIVER  (s3 planned)
  path: ./data/blobs         # RWS_STORAGE_PATH    shared volume when clustered

index:
  driver: sqlite             # RWS_INDEX_DRIVER  sqlite (single node) | postgres (cluster)
  dsn: file:./data/index.db  # RWS_INDEX_DSN     e.g. postgres://rws:pw@db:5432/rws

events:
  driver: log                # RWS_EVENTS_DRIVER  none | log | nats
  url: nats://127.0.0.1:4222 # RWS_EVENTS_URL
  stream: RWS_DICOM
  replicas: 1                # 3 when running a NATS cluster
  max_age_days: 7
