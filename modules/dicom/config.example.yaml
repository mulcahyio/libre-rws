# LibreDCM configuration. Every value can also be set by environment
# variable (shown on the right); environment wins over this file.

admin:
  addr: ":8081"              # LIBRE_DCM_ADMIN_ADDR   health, readiness, metrics, version
  log_level: info            # LIBRE_DCM_LOG_LEVEL    debug | info | warn | error
  log_format: json           # LIBRE_DCM_LOG_FORMAT   json | text
  # token: change-me         # LIBRE_DCM_ADMIN_TOKEN  bearer token for /metrics, /version
  # tls_cert_file: /etc/libredcm/tls/tls.crt  # LIBRE_DCM_ADMIN_TLS_CERT  serve admin over HTTPS
  # tls_key_file:  /etc/libredcm/tls/tls.key  # LIBRE_DCM_ADMIN_TLS_KEY
  shutdown_timeout: 30s      # LIBRE_DCM_SHUTDOWN_TIMEOUT
  # node_id: dicom-1         # LIBRE_DCM_NODE_ID      defaults to hostname

dicom:
  ae_title: LIBREDCM         # LIBRE_DCM_AE_TITLE
  listen: ":11112"           # LIBRE_DCM_LISTEN
  allow_any_called_ae_title: false
  accept_any_sop_class: false
  max_associations: 64       # per node; excess gets a transient reject (retry later)
  max_pdu_length: 131072
  handshake_timeout: 30s
  idle_timeout: 5m
  find_limit: 1000           # max C-FIND matches returned
  get_max_bytes: 1073741824  # C-GET buffers in memory (library limit) - cap it
  # tls_cert_file: /etc/libredcm/tls/dicom.crt   # DICOM TLS (port 2762 by convention)
  # tls_key_file:  /etc/libredcm/tls/dicom.key
  remote_aes:                # C-MOVE destinations
    VIEWER1: {host: 10.0.0.20, port: 11112}
    # PACS_B: {host: pacs-b.example, port: 104, ae_title: PACSB}

storage:
  driver: fs                 # LIBRE_DCM_STORAGE_DRIVER  fs | s3
  path: ./data/blobs         # LIBRE_DCM_STORAGE_PATH    shared volume when clustered

  # s3:                      # driver: s3  (AWS S3 or any S3-compatible store)
  #   endpoint: s3.amazonaws.com   # LIBRE_DCM_STORAGE_S3_ENDPOINT
  #   bucket: libredcm             # LIBRE_DCM_STORAGE_S3_BUCKET
  #   region: us-east-1
  #   access_key: ...              # or the AWS credential chain
  #   secret_key: ...
  #   prefix: site-a/
  #   create_bucket: false

index:
  driver: sqlite             # LIBRE_DCM_INDEX_DRIVER  sqlite (single node) | postgres (cluster)
  dsn: file:./data/index.db  # LIBRE_DCM_INDEX_DSN     e.g. postgres://rws:pw@db:5432/rws

events:
  driver: log                # LIBRE_DCM_EVENTS_DRIVER  none | log | nats
  url: nats://127.0.0.1:4222 # LIBRE_DCM_EVENTS_URL
  stream: LIBRE_DCM           # an upgraded 0.1.x install keeps its RWS_DICOM stream
  replicas: 1                # 3 when running a NATS cluster
  max_age_days: 7
  legacy_subjects: true      # LIBRE_DCM_EVENTS_LEGACY_SUBJECTS  also publish old rws.dicom.* subjects
