{{define "title"}}Log in{{end}}
{{define "content"}}
<section class="card narrow">
<h1>Log in</h1>
{{if .Notice}}<p class="msg info">{{.Notice}}</p>{{end}}
{{if .Error}}<p class="msg error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login">
<label>Username <input name="username" value="{{.Username}}" required autocomplete="username" autofocus></label>
<label>Password <input name="password" type="password" required autocomplete="current-password"></label>
<button class="primary">Log in</button>
</form>
</section>
{{end}}
